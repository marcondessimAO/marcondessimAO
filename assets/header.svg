<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-label="Cabeçalho do perfil"><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#fff}.wave{animation:slide 14s linear infinite}.wave2{animation:slide 22s linear infinite reverse}@keyframes slide{to{transform:translateX(-600px)}}.phrase{opacity:0;animation:cycle 9s ease-in-out infinite}@keyframes cycle{0%{opacity:0;transform:translateY(10px)}6%,28%{opacity:1;transform:none}34%,100%{opacity:0;transform:translateY(-10px)}}.name{opacity:0;animation:fade 1s ease .1s forwards}@keyframes fade{to{opacity:1}}</style><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1f6feb"/><stop offset="1" stop-color="#8957e5"/></linearGradient><clipPath id="frame"><rect width="1200" height="240" rx="16"/></clipPath></defs><g clip-path="url(#frame)"><rect width="1200" height="240" fill="url(#bg)"/><path class="wave" fill="#fff" fill-opacity=".10" d="M0 170 q150 -50 300 0 t300 0 t300 0 t300 0 t300 0 t300 0 t300 0 t300 0 V240 H0Z"/><path class="wave2" fill="#fff" fill-opacity=".07" d="M-300 190 q150 -50 300 0 t300 0 t300 0 t300 0 t300 0 t300 0 t300 0 t300 0 V240 H-300Z"/></g><text class="name" x="600" y="104" text-anchor="middle" font-size="50" font-weight="700">Marcondes</text><text class="phrase" style="animation-delay:0s" x="600" y="152" text-anchor="middle" font-size="22" fill-opacity=".92">Desenvolvedor Full-Stack</text><text class="phrase" style="animation-delay:3s" x="600" y="152" text-anchor="middle" font-size="22" fill-opacity=".92">Java · Spring Boot · React · Next.js</text><text class="phrase" style="animation-delay:6s" x="600" y="152" text-anchor="middle" font-size="22" fill-opacity=".92">Construindo sistemas na Synapse Tech</text></svg>